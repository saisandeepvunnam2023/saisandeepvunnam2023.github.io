<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sai Sandeep Vunnam — Portfolio</title>
  <meta name="description" content="Portfolio of Sai Sandeep Vunnam — Web Development • AI/ML • UI/UX. 175+ websites shipped, University of Dayton Magazine projects." />
  <meta property="og:title" content="Sai Sandeep Vunnam — Portfolio" />
  <meta property="og:description" content="Web Developer • AI/ML • UI/UX" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="saisandeep.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0c10; --panel:#10131a; --text:#e9eef7; --muted:#a7b0c0;
      --brand:#7c4dff; --brand2:#00e0ff; --ring:rgba(124,77,255,.35);
      --border:rgba(255,255,255,.10)
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text); background:
        radial-gradient(1100px 700px at 85% -20%, rgba(124,77,255,.18), transparent 60%),
        radial-gradient(900px 600px at -10% 0%, rgba(0,224,255,.18), transparent 60%),
        var(--bg);
      line-height:1.6
    }
    a{color:inherit;text-decoration:none}
    .container{width:min(1120px,92vw);margin:0 auto}
    header{position:sticky;top:0;z-index:30;backdrop-filter:saturate(150%) blur(10px);
      background:linear-gradient(180deg,rgba(11,12,16,.9),rgba(11,12,16,.65));
      border-bottom:1px solid var(--border)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .brand{font-weight:800;letter-spacing:.5px}
    .brand span{color:var(--brand)}
    .nav a{margin-left:18px;color:var(--muted);font-weight:500}
    .nav a:hover{color:var(--text)}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);
      background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));cursor:pointer}
    .btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b0c10;font-weight:700}
    .btn:hover{box-shadow:0 0 0 4px var(--ring)}
    .hero{padding:96px 0 56px;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
    .hero h1{font-size:clamp(32px,6vw,56px);line-height:1.1;margin:0}
    .hero p{color:var(--muted);font-size:18px;margin-top:12px}
    .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:6px 12px;color:var(--muted);font-size:14px}
    .headshot{border-radius:18px;border:1px solid var(--border);overflow:hidden;background:#0f1116}
    .headshot img{width:100%;height:auto;display:block}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
    .kpi{text-align:center;padding:16px;border-radius:14px;border:1px dashed var(--border)}
    .kpi strong{display:block;font-size:28px}
    .section{padding:54px 0}
    h2{font-size:28px;margin:0 0 16px}
    .panel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:18px;padding:18px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:14px;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.03);display:flex;flex-direction:column}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0f1116;display:block} /* show real cover images for issue cards */ /* replaced by .thumb */
    .card .body{padding:14px 14px 18px}
    .card h3{margin:0 0 8px;font-size:18px}
    .card p{margin:0 0 12px;color:var(--muted);font-size:15px}
    .card .tags{display:flex;gap:8px;flex-wrap:wrap}
    .card .tags span{font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
    footer{padding:42px 0;color:var(--muted);text-align:center;border-top:1px solid var(--border);margin-top:48px}
    /* router view */
    .view{min-height:40vh}
    .thumb{width:100%;aspect-ratio:16/9;position:relative;border-bottom:1px solid var(--border);border-radius:0;background:linear-gradient(135deg,var(--c1,#7c4dff),var(--c2,#00e0ff));background-size:200% 200%;animation:shift 8s ease-in-out infinite alternate}
    .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 120% -20%, rgba(255,255,255,.25), transparent 60%)}
    .thumb span{position:absolute;left:12px;bottom:10px;font-weight:700;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:10px}
    .subtle{margin:18px 0 10px;color:var(--muted);font-size:16px;font-weight:600}
    @keyframes shift{from{background-position:0% 30%}to{background-position:100% 70%}}
    /* responsive */
    @media (max-width: 980px){.hero{grid-template-columns:1fr}.grid-2,.grid-3,.cards,.kpis{grid-template-columns:1fr}.nav a{margin-left:12px}}
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" data-link href="#/">Sai <span>Sandeep</span> V.</a>
      <nav>
        <a data-link href="#/">Home</a>
        <a data-link href="#/projects">Projects</a>
        <a data-link href="#/experience">Experience</a>
        <a data-link href="#/contact">Contact</a>
        <a class="btn" data-link href="#/resume">Resume</a>
      </nav>
    </div>
  </header>

  <main class="container view" id="app"><!-- content injected by router --></main>

  <footer>
    <div class="container">©️ <span id="y"></span> Sai Sandeep Vunnam • Dayton, OH • <a href="mailto:vunnamsaisandeep20@gmail.com">vunnamsaisandeep20@gmail.com</a></div>
  </footer>

  <script>
    // --- DATA ---
    const INFO = {
      name: 'Sai Sandeep Vunnam',
      tagline: 'Web Development • AI/ML • UI/UX',
      summary: `I am a proactive Computer Science graduate with expertise in web development, AI-driven analytics, and UI/UX design. Since 2023, I have worked on the University of Dayton’s academic and magazine websites, where I designed and deployed 175+ responsive sites and automation solutions. This work contributed to a measurable 15% increase in overall magazine engagement. Skilled in Python, JavaScript, React, Angular, OpenCV, and TensorFlow, I combine strong technical abilities with design thinking to deliver clean, high-performing digital products.`,
      location: 'Dayton, Ohio, USA',
      graduation: 'August 2025',
      email: 'vunnamsaisandeep20@gmail.com',
      phone: '+1 (940) 843-8351',
      links: {
        magazine: 'https://udayton.edu/magazine/index.php',
        linkedin: 'https://www.linkedin.com/',
        github: 'https://github.com/'
      }
    };

    // All magazine projects are published under the same site. Using representative tiles.
    const PROJECTS = [
      {title:'University of Dayton Magazine - Collection',
       desc:'Created and published the University of Dayton Magazine collection. Responsible for content architecture, theming, and deployment across 75+ pages.',
       tags:['Cascade CMS','Design System','Accessibility','Performance'],
       url: INFO.links.magazine, c1:'#7c4dff', c2:'#00e0ff'},
      {title:'UD Magazine — Site Revamp & Theming',
       desc:'Migrated layouts to a consistent design system, tuned performance and accessibility, and streamlined editorial workflows.',
       tags:['CMS','HTML/CSS/JS','Accessibility AA'], url: INFO.links.magazine, c1:'#32d7ff', c2:'#7c4dff'},
      {title:'UD Magazine — Issue Publishing Pipeline',
       desc:'Built repeatable templates and checklists to publish new issues faster with fewer errors. Integrated analytics and QA steps.',
       tags:['Templates','Automation','Analytics'], url: INFO.links.magazine, c1:'#22c55e', c2:'#06b6d4'},
      {title:'Media Optimization with OpenCV',
       desc:'Python/OpenCV pipeline for HDR optimization and dynamic resizing; integrated into CMS to cut manual editing time by ~40%.',
       tags:['Python','OpenCV','Automation'], url: INFO.links.magazine, c1:'#f97316', c2:'#f43f5e'},
      {title:'Qualtrics + GA Dashboards',
       desc:'Embedded feedback and analytics dashboards in CMS pages for live insights that boosted engagement by ~15%.',
       tags:['Qualtrics','GA','Dashboards'], url: INFO.links.magazine, c1:'#a78bfa', c2:'#60a5fa'}
    ];

    // Specific magazine issues you created and published
    const MAG_ISSUES = [
      {label:'Summer 2025', title:'UD Magazine — Summer 2025', url:'https://udayton.edu/magazine/2025/summer-2025.php', img:'summer2025.png'},
      {label:'Spring 2025', title:'UD Magazine — Spring 2025', url:'https://udayton.edu/magazine/2025/spring-2025.php', img:'spring2025.png'},
      {label:'Winter 24–25', title:'UD Magazine — Winter 2024–25', url:'https://udayton.edu/magazine/2024/winter-24-25.php', img:'winter2024-25.png'},
      {label:'Autumn 2024', title:'UD Magazine — Fall 2024', url:'https://udayton.edu/magazine/2024/autumn-2024.php', img:'fall2024.png'},
      {label:'Summer 2024', title:'UD Magazine — Summer 2024', url:'https://udayton.edu/magazine/2024/summer2024.php', img:'summer2024.png'},
      {label:'Spring 2024', title:'UD Magazine — Spring 2024', url:'https://udayton.edu/magazine/2024/spring-2024.php', img:'spring2024.png'},
      {label:'Winter 23–24', title:'UD Magazine — Winter 2023–24', url:'https://udayton.edu/magazine/2023/winter-23-24.php', img:'winter2023-24.png'}
    ];

    const EXPERIENCE = [
      {role:'Twitter Account Management', company:'University of Dayton', period:'Jan 2024 - Present', bullets:[
        'Developed and managed content strategies that boosted engagement and generated quality leads.',
        'Created bilingual content to reach a broader audience and aligned posts with crypto/blockchain trends.',
        'Wrote and edited posts for accuracy, clarity, and brand consistency; coordinated across design, marketing, and tech teams.',
        'Used Google Analytics, HubSpot, and platform insights to track performance and improve results.',
        'Integrated ONNX into a CoreML iOS preview app (Obj‑C/Swift) for on‑device performance forecasts.',
        'Applied Adobe Sensei to refresh templates and visuals across social presence.'
      ]},
      {role:'Web Content Developer', company:'University of Dayton', period:'Nov 2023 – Present', bullets:[
        'Created and launched 175+ academic and magazine sites in Cascade CMS; content architecture, theming, deployment.',
        'Delivered WordPress projects with custom themes, plugins, and performance optimizations.',
        'Designed high‑fidelity prototypes in Figma; translated to responsive HTML/CSS/JS components.',
        'Python/OpenCV pipelines for HDR optimization and dynamic resizing (−40% manual editing time).',
        'Embedded Qualtrics + GA dashboards; boosted engagement by ~15%.',
        'Active project: University of Dayton Magazine — ' + INFO.links.magazine
      ]},
      {role:'Web Archiving & Content Management', company:'University of Dayton', period:'Oct 2023 – Mar 2025', bullets:[
        'Scanned 2,500+ pages with OpenCV/TensorFlow to flag stale layouts and visuals.',
        'Cleaned 1,600+ obsolete assets using CV labels + usage data; aligned with archival policy.',
        'Wrote image‑analysis scripts to eliminate duplicates and low‑value media.',
        'Provided clear audit logs and Excel reports for each processing step.',
        'Used Spark for parallel processing to speed bulk scans.'
      ]},
      {role:'Web Content Developer', company:'Indian School of Business', period:'Sep 2022 – May 2023', bullets:[
        'Managed 40+ academic pages in WordPress (PHP/MySQL), ensuring consistent, performant, mobile‑friendly UI.',
        'Planned and published content to increase program awareness and leads.',
        'Customized themes, integrated plugins, and optimized SEO.',
        'Worked cross‑functionally to align messaging and timelines; tracked metrics to refine strategy.'
      ]},
      {role:'Website Creator / UI/UX Designer', company:'VNR VJIET', period:'Jun 2020 – May 2021', bullets:[
        'Built the institute website and event microsites with WordPress; secure, performant managed hosting.',
        'Produced user flows and prototypes in Figma/Adobe XD; improved engagement by ~25%.',
        'Created custom illustrations (Illustrator) and motion banners (After Effects).',
        'Presented design/tech concepts to technical and non‑technical stakeholders.'
      ]}
    ];

    const SKILLS = {
      'Programming & Development':['Python','C','C++','C#','HTML','CSS','JavaScript','PHP','MySQL'],
      'Frameworks & Libraries':['React','Angular','OpenCV','TensorFlow'],
      'ML & AI Tools':['ONNX','CoreML','AI‑driven analytics','Sentiment analysis','GitHub Copilot'],
      'GPU & Acceleration':['CUDA','Metal','OpenGL','OpenCL'],
      'UI/UX & Design':['Figma','Adobe XD','Illustrator','Photoshop','Lightroom','Premiere Pro','After Effects','Canva','Adobe Sensei'],
      'Visual Design':['Motion graphics','Animation','Illustration','Iconography','Interaction design'],
      'Web & CMS':['Cascade CMS','WordPress','HubSpot','Qualtrics'],
      'Data & Analytics':['SQL','Apache Spark','Google Analytics'],
      'Productivity':['Google Workspace','Microsoft Office Suite'],
      'Collaboration':['Project management','Stakeholder communication','Cross‑functional collaboration','Agile workflows']
    };

    const TRAINING = [
      'Employee of the Month — Indian School of Business',
      '75+ academic & magazine websites shipped end‑to‑end (Cascade CMS)',
      'CONVERGENCE hackathon participant — VNR VJIET'
    ];

    // --- VIEWS ---
    const Views = {
      home(){
        return `
        <section class="hero">
          <div>
            <span class="pill">Web Dev • AI/ML • UI/UX</span>
            <h1>Hi, I'm ${INFO.name}. I build clean, fast products with code + design.</h1>
            <p>${INFO.summary}</p>
            <div class="kpis">
              <div class="kpi"><strong>175+</strong><small>websites shipped</small></div>
              <div class="kpi"><strong>15%</strong><small>avg engagement lift</small></div>
              
            </div>
            <div style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap">
              <a class="btn primary" data-link href="#/projects">See Projects</a>
              <a class="btn" data-link href="#/resume">Resume</a>
              <a class="btn" href="#" data-action="show-email">Email</a>
            </div>
          </div>
          <div class="headshot"><img src="saisandeep.jpeg" alt="Portrait of ${INFO.name}"></div>
        </section>

        <section class="section">
          <h2>Skills</h2>
          <div class="grid-2">
            ${Object.entries(SKILLS).map(([k,vals])=>`
              <div class="panel"><h3 style="margin:0 0 10px">${k}</h3>
                <div class="chips">${vals.map(v=>`<span class='chip'>${v}</span>`).join('')}</div>
              </div>`).join('')}
          </div>
        </section>

        <section class="section">
          <h2>Featured Project</h2>
          <div class="panel">
            <p style="margin-top:0;color:var(--muted)">All magazine projects I created and published live here:</p>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
              <a class="btn primary" href="${INFO.links.magazine}" target="_blank" rel="noreferrer">University of Dayton Magazine</a>
              <a class="btn" data-link href="#/projects">Browse My Project Cards</a>
            </div>
          </div>
        </section>
        `;
      },

      projects(){
        return `
          <section class="section">
            <h2>Projects</h2>
            <h3 class="subtle">Magazine Issues (Published)</h3>
            <div class="cards">
              ${MAG_ISSUES.map(p=>`
                <article class='card'>
                  <img src='${p.img}' alt='${p.title} cover'>
                  <div class='body'>
                    <h3>${p.title}</h3>
                    <p>Created & published this issue in Cascade CMS (content architecture, theming, deployment).</p>
                    <div class='tags'><span>UD Magazine</span><span>Cascade CMS</span><span>Issue Publishing</span></div>
                    <div style='margin-top:12px'><a class='btn primary' href='${p.url}' target='_blank' rel='noreferrer'>View Issue</a></div>
                  </div>
                </article>`).join('')}
            </div>
          </section>
        `;
      },

      experience(){
        return `
          <section class='section'>
            <h2>Experience</h2>
            <div class='grid-3'>
              ${EXPERIENCE.map(x=>`
                <div class='panel'>
                  <h3 style='margin:0'>${x.role}</h3>
                  <div style='color:var(--muted)'>${x.company} • ${x.period}</div>
                  <ul style='margin:10px 0 0 18px'>${x.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
                </div>`).join('')}
            </div>
          </section>
          <section class='section'>
            <h2>Education</h2>
            <div class='panel'>
              <strong>University of Dayton</strong> — M.S. in Computer Science • ${INFO.location} • ${INFO.graduation}
            </div>
          </section>
          <section class='section'>
            <h2>Training & Recognition</h2>
            <div class='panel'><ul style='margin:0 0 0 18px'>${TRAINING.map(t=>`<li>${t}</li>`).join('')}</ul></div>
          </section>
        `;
      },

      resume(){
        return `
          <section class='section'>
            <h2>Resume</h2>
            <div class='panel'>
              <strong>${INFO.name}</strong> — ${INFO.location}<br/>
              817 Patterson Rd Apt A, Dayton, OH – 45419 • ${INFO.phone} • <a href='mailto:${INFO.email}'>${INFO.email}</a>
              
            </div>

            <div class='panel'>
              <h3 style='margin-top:0'>Summary</h3>
              <p>${INFO.summary}</p>
            </div>

            <div class='panel'>
              <h3 style='margin-top:0'>Education</h3>
              <strong>University of Dayton</strong> — Master of Science in Computer Science • ${INFO.graduation}
            </div>

            <div class='panel'>
              <h3 style='margin-top:0'>Skills</h3>
              ${Object.entries(SKILLS).map(([k,vals])=>`<div style='margin:6px 0'><strong>${k}:</strong> ${vals.join(', ')}</div>`).join('')}
            </div>

            <div class='panel'>
              <h3 style='margin-top:0'>Work Experience</h3>
              ${EXPERIENCE.map(x=>`<div style='margin:12px 0'><strong>${x.role}</strong> — ${x.company} <span style='color:var(--muted)'>(${x.period})</span>
                <ul style='margin:6px 0 0 18px'>${x.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join('')}
            </div>

            <div class='panel'>
              <h3 style='margin-top:0'>Training & Recognition</h3>
              <ul style='margin:0 0 0 18px'>${TRAINING.map(t=>`<li>${t}</li>`).join('')}</ul>
            </div>
          </section>
        `;
      },

      contact(){
        return `
          <section class='section'>
            <h2>Contact</h2>
            <div class='panel'>
              <p style='margin:0 0 10px;color:var(--muted)'>Open to full‑time roles and collaborations. Best way to reach me is email or phone.</p>
              <div style='display:flex;gap:12px;flex-wrap:wrap'>
                <a class='btn primary' href='mailto:${INFO.email}'>Email ${INFO.name.split(' ')[0]}</a>
                <a class='btn' href='tel:+19408438351'>Call ${INFO.phone}</a>
                <a class='btn' href='${INFO.links.magazine}' target='_blank'>View Magazine Work</a>
              </div>
            </div>
          </section>
        `;
      }
    };

    // --- HASH ROUTER (works with file:// and static hosting) ---
    const routes = {
      '/': Views.home,
      '/projects': Views.projects,
      '/experience': Views.experience,
      '/resume': Views.resume,
      '/contact': Views.contact
    };

    const getPath = () => (location.hash.slice(1) || '/');

    function render(path){
      const view = routes[path] || routes['/'];
      document.getElementById('app').innerHTML = view();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    // listen for hash changes
    window.addEventListener('hashchange', () => render(getPath()));

    // initial render
    render(getPath());
    document.addEventListener('click', (e)=>{ const el = e.target.closest('[data-action="show-email"]'); if(el){ e.preventDefault(); alert("Hi! I'm Sai Sandeep vunnam This is my email " + INFO.email + "."); }});
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
