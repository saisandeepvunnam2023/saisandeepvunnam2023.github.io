# Build the site with Python and publish it to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# After that, every push to main deploys.
#
# No npm install, no lockfile, no dependency cache — the build is stdlib Python,
# so this workflow has nothing to go stale. Image derivatives are committed, which
# is why Pillow is not needed here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 build.py

      - name: Check output
        run: python3 check.py

      # Pages must already be set to the "GitHub Actions" source for this to
      # work: Settings -> Pages -> Source -> GitHub Actions. That is a one-time
      # click. (Doing it from here with `enablement: true` is possible in
      # principle but fails on accounts without the permission, which takes the
      # whole build down with it.)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
